
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Awareness Demo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fafafa;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.phone {
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.card {
  background: white;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 28px 22px;
}

.logo {
  font-family: cursive;
  font-size: 42px;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 6px 0;
  border: 1px solid #ddd;
  border-radius: 5px;
  background: #fafafa;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 14px;
  border: none;
  border-radius: 6px;
  background: #3897f0;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.notice {
  color: #777;
  font-size: 13px;
  line-height: 1.6;
  margin-top: 20px;
}

#result {
  display: none;
}
</style>
</head>

<body>

<div class="phone">
  <div class="card">

    <div class="logo">Instagram</div>

    <div id="login">
      <input
        id="username"
        placeholder="Demo username"
        autocomplete="off"
      >

      <input
        id="password"
        type="password"
        placeholder="Demo password"
        autocomplete="off"
      >

      <button onclick="demoLogin()">
        Try demo login
      </button>
    </div>

    <div id="result">
      <h2>🛡️ Stay safe online!</h2>

      <p>
        This was a phishing-awareness simulation.
      </p>

      <p>
        Your password was never saved or transmitted.
      </p>

      <button onclick="resetDemo()">
        Try again
      </button>
    </div>

  </div>

  <div class="notice">
    Educational demonstration only.<br>
    Not an official Instagram website.
  </div>
</div>

<script>
function demoLogin() {
  const user = document.getElementById("username");
  const pass = document.getElementById("password");

  if (!user.value.trim() || !pass.value) {
    alert("Enter fictional demo details first.");
    return;
  }

  // Password is immediately cleared.
  pass.value = "";

  document.getElementById("login").style.display = "none";
  document.getElementById("result").style.display = "block";
}

function resetDemo() {
  document.getElementById("username").value = "";
  document.getElementById("password").value = "";

  document.getElementById("login").style.display = "block";
  document.getElementById("result").style.display = "none";
}
</script>

</body>
</html>
